name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate repository policy
        run: make check

  release-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install release audit tools
        run: brew install ripgrep
      - name: Re-resolve committed dependency graphs
        run: |
          swift package resolve
          swift package --package-path Packages/ColdSignerTransport resolve
          git diff --exit-code -- Package.resolved Packages/ColdSignerTransport/Package.resolved
      - name: Validate pinned release metadata
        run: make release-audit

  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned dependencies
        run: swift package resolve
      - name: Test ColdSignerCore
        run: make core-test

  core-address-sanitizer:
    # The linked ASan process is killed on the 7 GB arm64 runner. The standard
    # Intel runner provides 14 GB for this evidence job.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic core corpus with AddressSanitizer
        run: |
          set -o pipefail
          make core-sanitizer 2>&1 | tee core-address-sanitizer.log
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-address-sanitizer-${{ github.sha }}
          path: core-address-sanitizer.log
          if-no-files-found: error

  transport-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded optical transport
        run: >-
          swift test
          --package-path Packages/ColdSignerTransport
          --scratch-path /tmp/coldsigner-transport-build

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audit tools
        run: brew install xcodegen ripgrep
      - name: Generate project
        run: make generate
      - name: Build for simulator
        run: >-
          xcodebuild build
          -project ColdSigner.xcodeproj
          -scheme ColdSigner
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/coldsigner-derived-data
          CODE_SIGNING_ALLOWED=NO
      - name: Audit built app for network capabilities
        run: >-
          ./scripts/audit_built_app.sh
          /tmp/coldsigner-derived-data/Build/Products/Debug-iphonesimulator/ColdSigner.app
      - name: Run unit tests
        run: >-
          xcodebuild test
          -project ColdSigner.xcodeproj
          -scheme ColdSigner
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -derivedDataPath /tmp/coldsigner-derived-data
          CODE_SIGNING_ALLOWED=NO
