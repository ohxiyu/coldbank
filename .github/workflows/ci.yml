name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate repository policy
        run: make check

  coordinator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Coordinator/package-lock.json
      - name: Install pinned web dependencies
        working-directory: Coordinator
        run: npm ci --ignore-scripts
      - name: Type-check coordinator
        working-directory: Coordinator
        run: npm run typecheck
      - name: Build and test coordinator
        working-directory: Coordinator
        run: npm test

  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned dependencies
        run: swift package resolve
      - name: Test ColdSignerCore
        run: make core-test

  transport-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded BC-UR transport
        run: >-
          swift test
          --package-path Packages/ColdSignerTransport
          --scratch-path /tmp/coldsigner-transport-build

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make generate
      - name: Build for simulator
        run: >-
          xcodebuild build
          -project ColdSigner.xcodeproj
          -scheme ColdSigner
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: >-
          xcodebuild test
          -project ColdSigner.xcodeproj
          -scheme ColdSigner
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          CODE_SIGNING_ALLOWED=NO
