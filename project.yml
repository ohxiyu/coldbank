name: ColdSigner
options:
  bundleIdPrefix: org.coldsigner
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  ColdSignerCorePackage:
    path: .
  ColdSignerTransportPackage:
    path: Packages/ColdSignerTransport
targets:
  ColdSigner:
    type: application
    platform: iOS
    sources:
      - path: ColdSignerApp
    info:
      path: ColdSignerApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: ColdSigner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: ColdSigner uses the camera only to scan offline PSBT and wallet QR codes.
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: ColdSignerApp/Resources/ColdSigner.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.coldsigner.app
        PRODUCT_NAME: ColdSigner
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ColdSignerCorePackage
        product: ColdSignerCore
      - package: ColdSignerTransportPackage
        product: ColdSignerTransport
    scheme:
      testTargets:
        - ColdSignerTests
      gatherCoverageData: true
  ColdSignerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColdSignerAppTests
    dependencies:
      - target: ColdSigner
      - package: ColdSignerCorePackage
        product: ColdSignerCore
      - package: ColdSignerTransportPackage
        product: ColdSignerTransport
